name: Linux USB gamepad preview

on:
  push:
    branches: [linux-gamepad-download]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_RELEASE_DEBUG: 0
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libasound2-dev libudev-dev nasm libvulkan1
          rustup update stable --no-self-update
          rustup default stable
      - name: Test controller mapping and lifecycle
        run: cargo test --locked --release -p connect --bin connect gui::gamepad
      - name: Build Linux viewer
        run: cargo build --locked --release -p connect
      - name: Smoke test and package
        run: |
          target/release/connect --help
          ldd target/release/connect
          mkdir -p dist
          install -m 755 target/release/connect dist/connect-linux-x86_64
          tar -C dist -czf dist/connect-linux-x86_64.tar.gz connect-linux-x86_64
          cd dist
          sha256sum connect-linux-x86_64 connect-linux-x86_64.tar.gz > SHA256SUMS.txt
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: linux-usb-gamepad-preview
          path: dist/*
          if-no-files-found: error
          retention-days: 14
